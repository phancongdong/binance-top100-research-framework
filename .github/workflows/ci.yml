name: Offline synthetic checks
on: [push, pull_request]
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m research_framework demo --output run-example
      - run: python -B -m research_framework verify --output run-example
